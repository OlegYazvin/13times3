<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
<title id="title">Jane’s office — labeled overhead layout for confirmation</title>
<desc id="desc">Reference-based schematic of the existing frame 05 office revision, not to scale. The tall window wall and deep sill are at the top, with a catalpa outside at second-floor height. The bookcase, small wood desk and rounded green chair occupy the right end; the blue sofa and botanical prints occupy the left end. The door on the lower wall, long table and floor mat are tentative. A separate arrival diagram records the photographed wood and black metal stairs without claiming a verified corridor connection.</desc>
